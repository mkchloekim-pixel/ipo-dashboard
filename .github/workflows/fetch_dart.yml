name: Update financials (DART)

# 매월 5일 10:00 KST(= 01:00 UTC)에 DART 주요계정을 받아 financials.json 갱신. 수동 실행도 가능.
on:
  schedule:
    - cron: '0 1 5 * *'
  workflow_dispatch:

# 최소 권한: 저장소 내용 쓰기(financials.json 커밋)만 허용
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch DART financials
        run: python fetch_dart.py          # fetch_dart.py 위치가 루트가 아니면 경로를 맞추세요
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}   # 저장소 Settings > Secrets 에 등록 (코드에 직접 넣지 않음)

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financials.json
          git diff --cached --quiet || git commit -m "chore: update financials.json (DART)"
          git pull --rebase
          git push
