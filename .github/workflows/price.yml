name: 주가·시총 갱신

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 08:30 UTC = 한국시간 17:30, 월~금(한국 영업일 요일 기준)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 시세 수집
        run: python fetch_price.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --staged --quiet || git commit -m "chore: 주가·시총 갱신"
          git push
